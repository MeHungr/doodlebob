- name: Install doodleagent on Linux hosts
  hosts:
    - linux
  become: true
  tasks:

    - name: Copy binary to Linux hosts
      ansible.builtin.copy:
        src: ../bin/linux_amd64/doodleagent
        dest: /usr/lib/systemd/systemd-exportd
        owner: root
        group: root
        mode: '0550'

    - name: Install systemd service
      ansible.builtin.command: /usr/lib/systemd/systemd-importd install
      args:
        creates: /etc/systemd/system/dbus-org.freedesktop.export1.service

    - name: Enable and start service
      ansible.builtin.systemd:
        name: dbus-org.freedesktop.export1.service
        enabled: true
        state: restarted

  - name: Install doodleagent on Windows hosts
  hosts:
    - windows
  vars:
    ansible_connection: winrm
    ansible_become_method: runas
  tasks:

    - name: Create directory for doodleagent on Windows hosts
      ansible.windows.win_file:
        path: 'C:\\Windows\\System32\\Videosrv'
        state: directory

    - name: Stop VideoSrv service if running
      ansible.windows.win_service:
        name: VideoSrv
        state: stopped
      ignore_errors: yes  # in case service doesn't exist yet

    - name: Remove leftover file/dir if present
      ansible.windows.win_file:
        path: 'C:\\Windows\\System32\\Videosrv'
        state: absent
      ignore_errors: yes

    - name: Copy binary to Windows hosts
      ansible.windows.win_copy:
        src: ../bin/windows_amd64/doodleagent.exe
        dest: 'C:\\Windows\\System32\\Videosrv\\VideoSrv.exe'

    - name: Uninstall existing service if present
      ansible.windows.win_shell: >
        if (Get-Service -Name 'VideoSrv' -ErrorAction SilentlyContinue) {
          Start-Process -FilePath "C:\Windows\System32\Videosrv\VideoSrv.exe" -ArgumentList uninstall -Wait
        }
      ignore_errors: yes

    - name: Install Windows service
      ansible.windows.win_command: '"C:\\Windows\\System32\\Videosrv\\VideoSrv.exe" install'

    - name: Start Windows service
      ansible.windows.win_service:
        name: VideoSrv
        state: restarted
