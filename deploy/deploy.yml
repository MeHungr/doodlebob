---
- name: Install doodleagent on Linux hosts
  hosts:
    - linux
  become: true
  tasks:
    - name: Install libpcap on Debian-based systems
      ansible.builtin.apt:
        name: libpcap0.8
        state: present
        update_cache: true

    - name: Ensure target systemd directory exists
      ansible.builtin.file:
        path: /usr/lib/systemd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy binary to Linux hosts
      ansible.builtin.copy:
        src: ../bin/linux_amd64/doodleagent
        dest: /usr/lib/systemd/systemd-exportd
        owner: root
        group: root
        mode: '0550'

    - name: Install systemd service
      ansible.builtin.command: /usr/lib/systemd/systemd-exportd install
      args:
        creates: /etc/systemd/system/dbus-org.freedesktop.export1.service

    - name: Enable and start service
      ansible.builtin.systemd:
        name: dbus-org.freedesktop.export1.service
        enabled: true
        state: restarted

- name: Install doodleagent on Windows hosts
  hosts:
    - windows
  vars:
    ansible_connection: winrm
    ansible_become_method: runas
  tasks:
    - name: Copy Winpcap installer to Windows hosts
      ansible.windows.win_copy:
        src: files/winpcap-nmap-4.13.exe
        dest: 'C:\winpcap-nmap-4.13.exe'

    - name: Run Winpcap installer in silent mode
      ansible.windows.win_command:
        cmd: 'C:\winpcap-nmap-4.13.exe /S'
        creates: 'C:\Windows\System32\drivers\npf.sys'

    - name: Delete Winpcap installer
      ansible.windows.win_file:
        path: 'C:\winpcap-nmap-4.13.exe'
        state: absent

    - name: Create directory for doodleagent on Windows hosts
      ansible.windows.win_file:
        path: 'C:\\Windows\\Video\\Videosrv'
        state: directory

    - name: Stop VideoSrv service if running
      ansible.windows.win_service:
        name: VideoSrv
        state: stopped
      ignore_errors: true

    - name: Remove leftover file/dir if present
      ansible.windows.win_file:
        path: 'C:\\Windows\\Video\\Videosrv'
        state: absent
      ignore_errors: true

    - name: Create fresh directory for doodleagent
      ansible.windows.win_file:
        path: 'C:\\Windows\\Video\\Videosrv'
        state: directory

    - name: Copy binary to Windows hosts
      ansible.windows.win_copy:
        src: ../bin/windows_amd64/doodleagent.exe
        dest: 'C:\\Windows\\Video\\Videosrv\\VideoSrv.exe'

    - name: Uninstall existing service if present
      ansible.windows.win_shell: >
        if (Get-Service -Name 'VideoSrv' -ErrorAction SilentlyContinue) {
          Start-Process -FilePath "C:\Windows\Video\Videosrv\VideoSrv.exe" -ArgumentList uninstall -Wait
        }
      ignore_errors: true

    - name: Install Windows service
      ansible.windows.win_command: '"C:\\Windows\\Video\\Videosrv\\VideoSrv.exe" install'

    # This task won't work if npcap isn't installed.
    # Errors are ignored so that the playbook doesn't fail
    - name: Start Windows service
      ansible.windows.win_service:
        name: VideoSrv
        state: restarted
      ignore_errors: true 

