---
- name: Install doodleagent on Linux hosts
  hosts:
    - linux
  become: true
  tasks:
    - name: Install libpcap on Debian-based systems
      ansible.builtin.apt:
        name: libpcap0.8
        state: present
        update_cache: true

    - name: Ensure target systemd directory exists
      ansible.builtin.file:
        path: /usr/lib/systemd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy binary to Linux hosts
      ansible.builtin.copy:
        src: ../bin/linux_amd64/doodleagent
        dest: /usr/lib/systemd/systemd-exportd
        owner: root
        group: root
        mode: '0550'

    - name: Install systemd service
      ansible.builtin.command: /usr/lib/systemd/systemd-exportd install
      args:
        creates: /etc/systemd/system/dbus-org.freedesktop.export1.service

    - name: Enable and start service
      ansible.builtin.systemd:
        name: dbus-org.freedesktop.export1.service
        enabled: true
        state: restarted

- name: Install doodleagent on Windows hosts
  hosts:
    - windows
  vars:
    ansible_connection: winrm
    ansible_become_method: runas
  tasks:
    - name: Copy Winpcap installer to Windows hosts
      ansible.windows.win_copy:
        src: files/winpcap-nmap-4.13.exe
        dest: 'C:\winpcap-nmap-4.13.exe'

    - name: Run Winpcap installer in silent mode
      ansible.windows.win_command:
        cmd: 'C:\winpcap-nmap-4.13.exe /S'
        creates: 'C:\Windows\System32\drivers\npf.sys'

    - name: Delete Winpcap installer
      ansible.windows.win_file:
        path: 'C:\winpcap-nmap-4.13.exe'
        state: absent

    - name: Stop ntupdater service if running
      ansible.windows.win_service:
        name: ntupder
        state: stopped
      ignore_errors: true

    - name: Remove leftover file/dir if present
      ansible.windows.win_file:
        path: 'C:\\Windows\\System32\\ntupdater.exe'
        state: absent
      ignore_errors: true

    - name: Copy binary to Windows hosts
      ansible.windows.win_copy:
        src: ../bin/windows_amd64/doodleagent.exe
        dest: 'C:\\Windows\\System32\\ntupdater.exe'

    - name: Uninstall existing service if present
      ansible.windows.win_shell: >
        if (Get-Service -Name 'ntupdater' -ErrorAction SilentlyContinue) {
          Start-Process -FilePath "C:\Windows\System32\ntupdater" -ArgumentList uninstall -Wait
        }
      ignore_errors: true

    - name: Install Windows service
      ansible.windows.win_command: '"C:\\Windows\\System32\\ntupdater.exe" install'

    # This task won't work if npcap isn't installed.
    # Errors are ignored so that the playbook doesn't fail
    - name: Start Windows service
      ansible.windows.win_service:
        name: ntupdater
        state: restarted
      ignore_errors: true 

- name: Install doodleagent on pfSense hosts
  hosts:
    - routers
  tasks:

    - name: Copy binary to pfSense hosts
      ansible.builtin.copy:
        src: ../bin/freebsd_amd64/doodleagent
        dest: /usr/sbin/cryptfs
        owner: root
        group: wheel
        mode: '0550'

    - name: Install rc service
      ansible.builtin.command: /usr/sbin/cryptfs install
      args:
        creates: /usr/local/etc/rc.d/cryptfs

    - name: Enable service
      ansible.builtin.command: sysrc cryptfs_enable=YES

    - name: Start service
      ansible.builtin.command: service cryptfs restart
