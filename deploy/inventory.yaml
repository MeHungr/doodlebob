all:
  vars:
    ansible_user: xxxx
    ansible_password: "xxxx"

  children:
    linux:
      hosts:
        linux01:
          ansible_host: 10.10.40.15
      vars:
        ansible_connection: ssh
        ansible_become: true

    windows:
      hosts:
        windows01:
          ansible_host: 10.10.40.18
      vars:
        ansible_user: '.\xxxx'                    # Forces local authentication
        ansible_connection: winrm
        ansible_winrm_scheme: http                   # Forces HTTP protocol
        ansible_winrm_port: 5985                     # Forces HTTP port
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
